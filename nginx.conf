server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los ZIP de la DIAN se suben desde la pantalla de conciliación (varios a la vez); el default
    # de nginx (1 MB) los rechaza con 413. Mismo tope que la API (60 MB).
    client_max_body_size 60m;

    location /api/ {
        proxy_pass http://ferrealiados-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|ico|png|jpg|jpeg|svg|woff2?)$ {
        expires 30d;
        access_log off;
    }
}
