<mat-sidenav-container class="layout">
  <mat-sidenav #sidenav [mode]="esMovil() ? 'over' : 'side'" [opened]="!esMovil()" class="layout__sidenav">
    <div class="layout__logo">
      <img src="logo-mark.png" alt="Ferrealiados JV" />
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/productos" routerLinkActive="activo" (click)="esMovil() && sidenav.close()">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>Productos</span>
      </a>
      <a mat-list-item routerLink="/proveedores" routerLinkActive="activo" (click)="esMovil() && sidenav.close()">
        <mat-icon matListItemIcon>local_shipping</mat-icon>
        <span matListItemTitle>Proveedores</span>
      </a>
      <a mat-list-item routerLink="/alertas" routerLinkActive="activo" (click)="esMovil() && sidenav.close()">
        <mat-icon matListItemIcon>notifications</mat-icon>
        <span matListItemTitle>Alertas</span>
      </a>
      @if (esAdmin) {
        <a mat-list-item routerLink="/usuarios" routerLinkActive="activo" (click)="esMovil() && sidenav.close()">
          <mat-icon matListItemIcon>group</mat-icon>
          <span matListItemTitle>Usuarios</span>
        </a>
        <a mat-list-item routerLink="/configuracion" routerLinkActive="activo" (click)="esMovil() && sidenav.close()">
          <mat-icon matListItemIcon>settings</mat-icon>
          <span matListItemTitle>Configuración</span>
        </a>
      }
    </mat-nav-list>

    <span class="layout__version">v{{ version }}</span>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="layout__toolbar">
      <button mat-icon-button (click)="sidenav.toggle()" aria-label="Abrir menú">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="layout__titulo">Ferrealiados Cotizaciones</span>
      <span class="layout__spacer"></span>
      <span class="layout__usuario">{{ usuario()?.nombre }}</span>
      <button mat-icon-button (click)="cerrarSesion()" aria-label="Cerrar sesión">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="layout__contenido">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
